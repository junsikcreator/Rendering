name: Render
on:
  workflow_dispatch:
    inputs:
      mode:
        description: "test = 3 frames, full = poori video"
        type: choice
        options: [test, full]
        default: test
      duration:
        description: "Video length (seconds)"
        default: "10"
      fps:
        description: "FPS"
        default: "30"
      width:
        description: "Width"
        default: "1080"
      height:
        description: "Height"
        default: "1920"

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg fonts-noto fonts-noto-color-emoji
      - run: npm install
      - run: node render.js
        env:
          MODE: ${{ inputs.mode }}
          DURATION: ${{ inputs.duration }}
          FPS: ${{ inputs.fps }}
          WIDTH: ${{ inputs.width }}
          HEIGHT: ${{ inputs.height }}
      - uses: actions/upload-artifact@v4
        if: ${{ inputs.mode == 'test' }}
        with:
          name: test-frames
          path: out/*.png
      - uses: actions/upload-artifact@v4
        if: ${{ inputs.mode == 'full' }}
        with:
          name: video
          path: out/video.mp4
