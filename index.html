 if(type==='flash'){g.drawImage(e<.5?A:B,0,0);const a=1-Math.abs(e-.5)*2,q=g.createRadialGradient(CW/2,CH/2,0,CW/2,CH/2,CH*.7);q.addColorStop(0,'#fff8e6');q.addColorStop(1,'#ffdca000');g.globalAlpha=a;g.fillStyle=q;g.fillRect(0,0,CW,CH);g.globalAlpha=a*a*.7;g.fillStyle='#fff3dc';g.fillRect(0,0,CW,CH);g.globalAlpha=1}
 else if(type==='zoom'){g.save();g.translate(CW/2,CH/2);let s=1.35-.35*E;g.scale(s,s);g.drawImage(B,-CW/2,-CH/2);g.restore();g.save();g.translate(CW/2,CH/2);s=1+2*E;g.scale(s,s);g.globalAlpha=1-E;g.drawImage(A,-CW/2,-CH/2);g.restore();g.globalAlpha=1}
 else if(type==='glitch'){const n=14,h=CH/n,m=Math.sin(Math.PI*e),f=Math.floor(t*14);gs.clearRect(0,0,CW,CH);
  for(let i=0;i<n;i++){const r=rn(i,f);gs.drawImage(r<E?B:A,0,i*h,CW,h+1,(r-.5)*m*110,i*h,CW,h+1)}
  g.fillStyle='#000';g.fillRect(0,0,CW,CH);const sp=m*22;tint(S2,'#ff0000',-sp);tint(S2,'#00ffff',sp)}
 else if(type==='ink'){g.drawImage(A,0,0);const fr=CH*(1.25-1.5*E),n=12;
  const blobs=x=>{g.beginPath();g.rect(0,fr+40,CW,CH*2);for(let i=0;i<=n;i++){const px=i*CW/n,py=fr+Math.sin(i*1.9+t*3)*50+Math.cos(i*.7-t*2)*40,r=CH*.12+x+(i%3)*18;g.moveTo(px+r,py);g.arc(px,py,r,0,6.283)}};
  blobs(26);g.fillStyle='rgba(6,4,16,.85)';g.fill();g.save();blobs(0);g.clip();g.drawImage(B,0,0);g.restore()}
 else if(type==='slide'){const x=-E*CW,bl=Math.sin(Math.PI*e)*CW*.07,d=(im,ox)=>{g.globalAlpha=1;g.drawImage(im,ox,0);g.globalAlpha=.22;for(const k of[-2,-1,1,2])g.drawImage(im,ox+k*bl/2,0);g.globalAlpha=1};d(A,x);d(B,x+CW)}

const nz=mk();nz.width=nz.height=128;{const c=nz.getContext('2d'),d=c.createImageData(128,128);for(let i=0;i<d.data.length;i+=4){d.data[i]=d.data[i+1]=d.data[i+2]=Math.random()*255;d.data[i+3]=255}c.putImageData(d,0,0)}

function post(t){const g=main;g.setTransform(1,0,0,1,0,0);g.globalCompositeOperation='source-over';
 const v=g.createRadialGradient(CW/2,CH/2,CH*.3,CW/2,CH/2,CH*.75);v.addColorStop(0,'rgba(0,0,0,0)');v.addColorStop(1,'rgba(0,0,0,.6)');g.fillStyle=v;g.fillRect(0,0,CW,CH);
 g.save();g.translate(Math.random()*128,Math.random()*128);g.globalCompositeOperation='overlay';g.globalAlpha=.1;g.fillStyle=GR;g.fillRect(-128,-128,CW+256,CH+256);g.restore();
 const f=Math.min(clamp(t/.5),clamp((DUR-t)/.4));if(f<1){g.globalAlpha=1-f;g.fillStyle='#000';g.fillRect(0,0,CW,CH);g.globalAlpha=1}}
/* ---- TEXT ---- */
const LINES=[];
SCENES.forEach(S=>S.lines.forEach(L=>{const d=document.createElement('div');d.className='ln';d.style.setProperty('--tc',S.palette.text);d.style.setProperty('--gc',S.palette.glow);d.style.setProperty('--ac',S.palette.acc);
 L.cs=[];L.ws=[];L.on=0;
 L.t.split('|').forEach((row,ri)=>{if(ri)d.appendChild(document.createElement('br'));row.split(' ').forEach(w=>{const k=w[0]==='*'?'em':w[0]==='~'?'gl':'';w=w.replace(/[*~]/g,'');
  const ws=document.createElement('span');ws.className='w '+k;ws.dataset.k=k;[...w].forEach(ch=>{const c=document.createElement('span');c.className='c';c.textContent=ch;ws.appendChild(c);L.cs.push(c)});d.appendChild(ws);L.ws.push(ws)})});
 $('txt').appendChild(d);L.el=d;LINES.push(L)}));
function updateText(t){for(const L of LINES){const u=t-L.s,el=L.el;
 if(u<0||t>=L.e){if(L.on){el.style.opacity=0;L.on=0}continue}
 L.on=1;const out=clamp((L.e-t)/.45),inn=clamp(u/.9);
 el.style.opacity=L.fx==='letters'?1:inn*out;
 if(L.fx==='letters')L.cs.forEach((c,i)=>{const q=clamp((u-i*.05)/.4)*out;c.style.opacity=q;c.style.transform=`translateY(${(1-q)*26}px)`});
 else if(L.fx==='blur'){el.style.filter=`blur(${(1-ease(inn))*24}px)`;el.style.letterSpacing=`${(1-ease(inn))*.18}em`}
 else el.style.setProperty('--gp',(16+22*Math.sin(t*3.2))+'px');
 L.ws.forEach(w=>{const k=w.dataset.k;
  if(k==='em'){w.style.transform=`scale(${1+.06*Math.sin(t*2.6)})`;w.style.textShadow=`0 0 ${26+16*Math.sin(t*2.6)}px var(--ac),0 0 60px var(--ac)`}
  else if(k==='gl'){const gl=(t*1.1)%1.9<.14;w.style.transform=gl?`translate(${(Math.random()-.5)*14}px,0)`:'';w.style.textShadow=gl?'5px 0 #ff2a6d,-5px 0 #05d9e8':''}})}}
/* ---- FRAME ---- */
function frame(t){let k=-1;
 for(let j=0;j<SCENES.length-1;j++){const s=SCENES[j],h=(s.tr||TR)/2;if(t>=s.end-h&&t<s.end+h){k=j;break}}
 if(k>=0){const s=SCENES[k];renderScene(ga,k,t);renderScene(gb,k+1,t);trans(s.transition,clamp((t-s.end)/(s.tr||TR)+.5),t)}
 else{let i=SCENES.findIndex(s=>t>=s.start&&t<s.end);if(i<0)i=SCENES.length-1;renderScene(main,i,t)}
 post(t);updateText(t)}
/* ================= AUDIO ================= */
let AC=null,bus=null,duck=null,rev=null,nodes=[],started=false,ducked=false,vo=null;
const mf=n=>440*Math.pow(2,(n-69)/12);
function initAudio(){if(AC)return;AC=new(window.AudioContext||window.webkitAudioContext)();duck=AC.createGain();duck.connect(AC.destination);
 rev=AC.createConvolver();const len=AC.sampleRate*3,buf=AC.createBuffer(2,len,AC.sampleRate);
 for(let c=0;c<2;c++){const d=buf.getChannelData(c);for(let i=0;i<len;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/len,2.6)}
 rev.buffer=buf;const rg=AC.createGain();rg.gain.value=.55;rev.connect(rg);rg.connect(duck)}
function pad(n,st,dur,v=.03){const o1=AC.createOscillator(),o2=AC.createOscillator(),f=AC.createBiquadFilter(),g=AC.createGain();
 o1.type=o2.type='sawtooth';o1.frequency.value=o2.frequency.value=mf(n);o2.detune.value=9;f.type='lowpass';f.frequency.value=650;
 g.gain.setValueAtTime(0,st);g.gain.linearRampToValueAtTime(v,st+1.6);g.gain.setValueAtTime(v,st+dur-.2);g.gain.linearRampToValueAtTime(0,st+dur+1.8);
 o1.connect(f);o2.connect(f);f.connect(g);g.connect(bus);o1.start(st);o2.start(st);o1.stop(st+dur+1.9);o2.stop(st+dur+1.9);nodes.push(o1,o2)}
function pno(n,st,v){const o=AC.createOscillator(),f=AC.createBiquadFilter(),g=AC.createGain();o.type='triangle';o.frequency.value=mf(n);f.type='lowpass';f.frequency.value=2200;
 g.gain.setValueAtTime(.0001,st);g.gain.exponentialRampToValueAtTime(v,st+.015);g.gain.exponentialRampToValueAtTime(.0001,st+2.8);
 o.connect(f);f.connect(g);g.connect(bus);o.start(st);o.stop(st+2.9);nodes.push(o)}
function startMusic(){stopMusic();initAudio();const n0=AC.currentTime+.08,r=rng(11);bus=AC.createGain();
 bus.gain.setValueAtTime(0,n0);bus.gain.linearRampToValueAtTime(.9,n0+2.5);bus.gain.setValueAtTime(.9,n0+DUR-3);bus.gain.linearRampToValueAtTime(0,n0+DUR-.1);
 bus.connect(duck);bus.connect(rev);
 const CH_=[[57,60,64,67],[53,57,60,64],[48,55,59,64],[55,59,62,66]],SQ=[0,1,2,3,0,1,2,3,1,0],PT=[0,2,1,3,2,1,3,2];
 SQ.forEach((ci,b)=>{const c=CH_[ci],t0=n0+b*4;c.forEach(n=>pad(n-12,t0,4.2));pad(c[0]-24,t0,4.2,.05);
  PT.forEach((k,j)=>{if(j&&r()<.22)return;pno(c[k]+12,t0+j*.5+(j%2)*.02,.1)});pno(c[0]-12,t0,.14)})}

 setTimeout(()=>{n.forEach(o=>{try{o.stop()}catch(e){}});b.disconnect()},500)}
function syncVO(force){if(!vo)return;const t=clk.t;
 if(clk.on){if(force||Math.abs(vo.currentTime-t)>.35)try{vo.currentTime=t}catch(e){}
  if(vo.paused&&!vo.ended&&t<(vo.duration||1e9))vo.play().catch(()=>{})}else vo.pause();
 const d=!!(vo&&!vo.paused&&!vo.ended);if(d!==ducked&&duck){ducked=d;duck.gain.setTargetAtTime(d?.3:1,AC.currentTime,.3)}}
$('file').onchange=e=>{const f=e.target.files[0];if(!f)return;if(vo){vo.pause();URL.revokeObjectURL(vo.src)}vo=new Audio(URL.createObjectURL(f));vo.preload='auto';vo.onended=()=>syncVO();if(clk.on)syncVO(true)};
/* ================= CLOCK & UI ================= */
const clk={t:0,on:false,last:0};let dirty=1;
const vids=f=>SCENES.forEach(S=>{if(S.vid)f(S.vid,S)});
function play(){initAudio();AC.resume();if(!started){started=true;startMusic()}
